name: Build and Deploy Kodi Repository

on:
  push:
    branches:
      - Kodi_22_Piers
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout skin source
        uses: actions/checkout@v4
        with:
          ref: Kodi_22_Piers

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Kodi repository structure
        run: |
          python .github/scripts/build_kodi_repo.py . .github/repository.skynet dist

      - name: Deploy to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          commit-message: "Auto-build Kodi repository [skip ci]"
